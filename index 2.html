<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>理論音声ノート</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f7fb;color:#18263a}header{background:#16365b;color:white;padding:17px;font-size:20px;font-weight:bold}main{display:flex;min-height:calc(100vh - 60px)}aside{width:185px;background:white;border-right:1px solid #ddd;padding:12px;box-sizing:border-box}section{flex:1;padding:20px;min-width:0}button,input,textarea{font:inherit}button{background:#225d96;color:white;border:0;border-radius:9px;padding:10px 13px;margin:4px;cursor:pointer}button.secondary{background:#e5ebf2;color:#173350}input,textarea{box-sizing:border-box;width:100%;border:1px solid #c7d1dd;border-radius:9px;padding:11px;margin:7px 0 15px;background:white}textarea{min-height:260px;line-height:1.8}.item{display:block;width:100%;text-align:left;background:#eef3f8;color:#173350;margin:7px 0;overflow-wrap:anywhere}.item.active{background:#cce0f7}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px}label{font-weight:600}select{font-size:16px;padding:9px}small{color:#52657c}@media(max-width:600px){main{display:block}aside{width:auto;border-right:0;border-bottom:1px solid #ddd}#list{display:flex;overflow:auto;gap:6px}.item{min-width:130px}section{padding:14px}}</style></head><body><header>📖 理論音声ノート</header><main><aside><button id="add">＋ 理論を追加</button><div id="list"></div></aside><section><label>理論番号</label><input id="number" placeholder="例：6-1"><label>タイトル</label><input id="title" placeholder="例：相続税の期限内申告"><label>理論本文（ここにコピペ）</label><textarea id="body" placeholder="覚えたい理論の文章を貼り付けてください"></textarea><div class="controls"><button id="save">保存</button><button id="play">▶ 読み上げ</button><button id="pause" class="secondary">⏸ 一時停止／再開</button><button id="stop" class="secondary">■ 停止</button><label for="speed">速度</label><select id="speed"><option value="0.75">0.75倍</option><option value="1" selected>1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option><option value="1.75">1.75倍</option><option value="2">2倍</option></select><button id="delete" class="secondary">削除</button></div><p id="speech-status" role="status" aria-live="polite">再生待機中</p><p><small>データはこのブラウザ内に保存されます。Safariのデータ削除や端末変更に備えて、下のバックアップ機能を使ってください。読み上げは端末の音声機能を使用します。</small></p><button id="export" class="secondary">バックアップを書き出す</button><button id="import" class="secondary">バックアップを読み込む</button><input type="file" id="file" accept="application/json" hidden></section></main><script>const $=id=>document.getElementById(id);let entries=[];try{entries=JSON.parse(localStorage.getItem('theory-notes-v1')||'[]')}catch(e){}let current=entries[0]?.id||null;const persist=()=>localStorage.setItem('theory-notes-v1',JSON.stringify(entries));function render(){const list=$('list');list.innerHTML='';entries.forEach(e=>{let b=document.createElement('button');b.className='item'+(e.id===current?' active':'');b.textContent=(e.number||'番号なし')+' '+(e.title||'無題');b.onclick=()=>{save(false);stopSpeech();current=e.id;render()};list.appendChild(b)});const e=entries.find(e=>e.id===current);$('number').value=e?.number||'';$('title').value=e?.title||'';$('body').value=e?.body||''}function save(show=true){if(!current){current=String(Date.now());entries.push({id:current})}let e=entries.find(e=>e.id===current);e.number=$('number').value;e.title=$('title').value;e.body=$('body').value;persist();if(show)alert('保存しました');render()}$('save').onclick=()=>save();$('add').onclick=()=>{if(current)save(false);stopSpeech();current=null;$('number').value='';$('title').value='';$('body').value='';$('number').focus()};$('delete').onclick=()=>{if(!current||!confirm('この理論を削除しますか？'))return;entries=entries.filter(e=>e.id!==current);current=entries[0]?.id||null;persist();render()};let activeSpeech=null;let speechTimer=null;let speechChunks=[];let speechIndex=0;let speechPaused=false;let speechSession=0;
function setSpeechStatus(message){$('speech-status').textContent=message}
function clearSpeechTimer(){if(speechTimer){clearTimeout(speechTimer);speechTimer=null}}
function stopSpeech(){speechSession++;clearSpeechTimer();speechChunks=[];speechIndex=0;speechPaused=false;activeSpeech=null;if('speechSynthesis' in window)window.speechSynthesis.cancel();setSpeechStatus('停止しました')}
function splitSpeech(text){let parts=text.match(/[^。！？\n]{1,110}[。！？\n]?|[^。！？\n]+/g)||[text];return parts.flatMap(part=>{let chunks=[];for(let i=0;i<part.length;i+=110)chunks.push(part.slice(i,i+110));return chunks}).filter(x=>x.trim())}
function speakNext(session){if(session!==speechSession||speechPaused)return;if(speechIndex>=speechChunks.length){activeSpeech=null;setSpeechStatus('読み上げ完了');return}const u=new SpeechSynthesisUtterance(speechChunks[speechIndex]);activeSpeech=u;u.lang='ja-JP';u.rate=Number($('speed').value);u.volume=1;const voices=window.speechSynthesis.getVoices();const japanese=voices.find(v=>v.lang==='ja-JP')||voices.find(v=>v.lang.startsWith('ja'));if(japanese)u.voice=japanese;u.onstart=()=>{if(session===speechSession)setSpeechStatus('読み上げ中 '+(speechIndex+1)+' / '+speechChunks.length)};u.onend=()=>{if(session!==speechSession)return;speechIndex++;speechTimer=setTimeout(()=>speakNext(session),80)};u.onerror=e=>{if(session!==speechSession||e.error==='canceled'||e.error==='interrupted')return;setSpeechStatus('音声エラー: '+e.error+'。Safariで開き直してお試しください')};window.speechSynthesis.speak(u)}
$('play').onclick=()=>{const t=$('body').value.trim();if(!t){alert('本文を入力してください');return}if(!('speechSynthesis' in window)){setSpeechStatus('このブラウザは音声読み上げに対応していません');return}try{save(false);stopSpeech();speechChunks=splitSpeech(t);speechIndex=0;const session=speechSession;setSpeechStatus('音声を準備しています…');speakNext(session)}catch(err){setSpeechStatus('再生に失敗しました: '+err.message)}};
$('pause').onclick=()=>{if(!('speechSynthesis' in window))return;if(speechPaused){speechPaused=false;setSpeechStatus('読み上げを再開します');if(window.speechSynthesis.paused)window.speechSynthesis.resume();else speakNext(speechSession)}else if(window.speechSynthesis.speaking){speechPaused=true;window.speechSynthesis.pause();setSpeechStatus('一時停止中')}};
$('stop').onclick=stopSpeech;
$('export').onclick=()=>{save(false);let blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='理論音声ノート_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let a=JSON.parse(await f.text());if(!Array.isArray(a)||!a.every(x=>typeof x.id==='string'))throw Error();if(!confirm('現在の登録内容をバックアップで置き換えますか？'))return;entries=a;current=entries[0]?.id||null;persist();render()}catch(err){alert('バックアップ形式が正しくありません')}};render();</script></body></html>
